services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mr
      POSTGRES_PASSWORD: mr
      POSTGRES_DB: mr_summarizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  pgdata:
