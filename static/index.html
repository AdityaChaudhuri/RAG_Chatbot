<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Summarizer</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd; --accent:#1f5f8b; --chip:#eef3f7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1e1e1c; --ink:#ecebe6; --muted:#9a9993; --line:#33322f; --accent:#7db4dd; --chip:#23303a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; }
  button { padding:11px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-top:16px; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 10px; }
  #answer { white-space: pre-wrap; }
  #answer a { color: var(--accent); text-decoration:none; font-size:12px; vertical-align: super; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--chip); border-radius:999px; padding:3px 10px; font-size:13px; cursor:pointer; border:0; color:var(--ink); }
  .src { padding:10px 0; border-top:1px solid var(--line); }
  .src:first-of-type { border-top:0; padding-top:0; }
  .src .t { font-weight:600; }
  .src .t a { color:inherit; }
  .src .meta { font-size:12px; color:var(--muted); margin:2px 0 4px; }
  .src .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:4px; background:var(--chip); margin-right:4px; }
  .src p { margin:0; font-size:14px; color:var(--muted); }
  .err { color:#c0392b; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Mr. Summarizer</h1>
  <p class="sub">Ask about the indexed financial news. Answers cite their sources.</p>
  <form id="f">
    <input id="q" placeholder="e.g. Why did European stocks fall at the start of 2018?" autocomplete="off" required minlength="3">
    <button id="go">Ask</button>
  </form>

  <section id="entBox" class="hidden"><h2>Entities recognised</h2><div class="chips" id="ents"></div><div id="graph"></div></section>
  <section id="ansBox" class="hidden"><h2>Answer</h2><div id="answer"></div></section>
  <section id="srcBox" class="hidden"><h2>Sources</h2><div id="sources"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
let es = null, raw = "";

const escapeHtml = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// turn [2] citations into links to the matching source
const renderAnswer = () => {
  $("answer").innerHTML = escapeHtml(raw).replace(/\[(\d+)\]/g, '<a href="#src$1">[$1]</a>');
};

function showSources(data) {
  $("ents").innerHTML = ""; $("graph").innerHTML = "";
  data.entities.forEach(name => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = name; b.type = "button";
    b.onclick = () => showGraph(name);
    $("ents").appendChild(b);
  });
  $("entBox").classList.toggle("hidden", data.entities.length === 0);

  $("sources").innerHTML = "";
  data.sources.forEach(s => {
    const div = document.createElement("div");
    div.className = "src"; div.id = "src" + s.n;
    const badges = Object.entries(s.ranks).map(([k, r]) => `<span class="badge">${k} #${r}</span>`).join("");
    const title = s.url ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>` : escapeHtml(s.title);
    div.innerHTML = `<div class="t">[${s.n}] ${title}</div>
      <div class="meta">${badges} rerank ${s.rerank ?? "n/a"}</div>
      <p>${escapeHtml(s.content.slice(0, 320))}${s.content.length > 320 ? "…" : ""}</p>`;
    $("sources").appendChild(div);
  });
  $("srcBox").classList.toggle("hidden", data.sources.length === 0);
}

async function showGraph(name) {
  const r = await fetch("/graph/" + encodeURIComponent(name));
  if (!r.ok) { $("graph").textContent = "Not found in graph."; return; }
  const g = await r.json();
  $("graph").innerHTML = `<p class="sub" style="margin:12px 0 6px">${escapeHtml(g.name)} (${g.label}, ${g.mentions} mentions) is most connected to:</p>`
    + `<div class="chips">${g.neighbours.map(n => `<span class="chip">${escapeHtml(n.name)} · ${n.shared_chunks}</span>`).join("")}</div>`;
}

$("f").onsubmit = e => {
  e.preventDefault();
  if (es) es.close();
  raw = ""; renderAnswer();
  $("ansBox").classList.remove("hidden");
  $("answer").textContent = "Searching…";
  $("go").disabled = true;

  es = new EventSource("/ask?q=" + encodeURIComponent($("q").value));
  es.addEventListener("sources", ev => { showSources(JSON.parse(ev.data)); $("answer").textContent = ""; });
  es.addEventListener("token", ev => { raw += JSON.parse(ev.data); renderAnswer(); });
  es.addEventListener("error", ev => {
    if (ev.data) $("answer").insertAdjacentHTML("beforeend", `<div class="err">${escapeHtml(JSON.parse(ev.data))}</div>`);
    es.close(); $("go").disabled = false;   // stop EventSource auto-reconnecting
  });
  es.addEventListener("done", () => { es.close(); $("go").disabled = false; });
};
</script>
</body>
</html>
